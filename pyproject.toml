[project]
name = "ecommerce-operations"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.6,<1",
  "langgraph-checkpoint-postgres>=2,<3",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "aiosqlite>=0.21,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "postgres_integration: requires the configured local PostgreSQL service",
  "deepseek_smoke: explicit real deepseek-flash smoke test",
]
